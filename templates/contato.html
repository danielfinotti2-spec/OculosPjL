<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Visão Boa</title>
    <link rel="stylesheet" href="/css/style.css?v=buttons-fix-2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Visão Boa</a>
    </header>
    <main class="contato-pagina">
        <a class="voltar-inicio" href="/"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a>
        <h1>Entre em contato</h1>
        <p class="contato-intro">Escolha o canal que preferir para falar com a gente.</p>
        <div class="contato-opcoes">
            <a class="contato-opcao" href="https://instagram.com/seuusuario" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram"></i><span><strong>Instagram</strong><small>@seuusuario</small></span><i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
            <a class="contato-opcao" href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp"></i><span><strong>WhatsApp</strong><small>+55 (00) 00000-0000</small></span><i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
            <a class="contato-opcao" href="mailto:seuemail@exemplo.com">
                <i class="fa-regular fa-envelope"></i><span><strong>E-mail</strong><small>seuemail@exemplo.com</small></span><i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>
        <p class="contato-aviso">Os dados acima são exemplos. Troque pelos seus contatos antes de divulgar a loja.</p>
    </main>
    {% include 'partials/rodape.html' %}
</body>
</html>
